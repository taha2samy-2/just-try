name: Handle Closed Pull Requests

on:
  pull_request:
    types: [closed]

jobs:
  process-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch
        if: github.event.pull_request.merged == true
        uses: SvanBoxel/delete-merged-branch@1.4.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Message for Merged PR
        if: github.event.pull_request.merged == true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'This pull request has been merged. The source branch `' + context.payload.pull_request.head.ref + '` has been deleted as part of standard repository maintenance.'
            })

      - name: Message for Closed/Unmerged PR
        if: github.event.pull_request.merged == false
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'This pull request has been closed without merging. The source branch `' + context.payload.pull_request.head.ref + '` has been retained.'
            })